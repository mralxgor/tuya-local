name: Floor heating thermostat
products:
  - id: fekemcg4hxekb8gi
    manufacturer: Teplosoft
    model: M2
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        range:
          min: 50
          max: 950
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 41
                  max: 199
              - dps_val: c
                scale: 10
                step: 5
                range:
                  min: 50
                  max: 950
      - id: 13
        type: integer
        optional: true
        name: temp_set_f
        hidden: true
        range:
          min: 410
          max: 1990
        mapping:
          - scale: 10
            step: 10
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_current_f
              - dps_val: c
                scale: 10
      - id: 14
        type: integer
        optional: true
        name: temp_current_f
        hidden: true
        mapping:
          - scale: 10
      - id: 15
        type: integer
        name: max_temperature
        range:
          min: 50
          max: 950
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: upper_temp_f
                range:
                  min: 41
                  max: 199
              - dps_val: c
                scale: 10
                step: 10
                range:
                  min: 50
                  max: 950
      - id: 17
        type: integer
        optional: true
        name: upper_temp_f
        hidden: true
        range:
          min: 410
          max: 1990
        mapping:
          - scale: 10
      - id: 16
        type: integer
        name: min_temperature
        range:
          min: 50
          max: 150
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: lower_temp_f
                range:
                  min: 41
                  max: 59
              - dps_val: c
                scale: 10
                step: 10
                range:
                  min: 50
                  max: 150
      - id: 18
        type: integer
        optional: true
        name: lower_temp_f
        hidden: true
        range:
          min: 410
          max: 590
        mapping:
          - scale: 10
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: auto
            value: program
          - dps_val: manual
            value: manual
          - dps_val: eco
            value: eco
      - id: 12
        type: string
        name: temperature_unit
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 12
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 9
        type: boolean
        name: lock
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 19
        type: integer
        name: value
        range:
          min: -99
          max: 99
        mapping:
          - scale: 10
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 11
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 11
        type: bitfield
        name: fault_code
      - id: 11
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: sensor fault
          - dps_val: 2
            value: motor fault
          - dps_val: 4
            value: heating fault
